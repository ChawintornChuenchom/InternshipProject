# 8-bit version of infer_base.yaml: 4-bit NF4 also squeezes the vision tower and read far worse than Ollama.
#   .venv\Scripts\llamafactory-cli.exe api ..\thai-doc-ocr\configs\infer_base_8bit.yaml
# evaluate.py --api already shrinks each page to a 1800 px longest side, so the limit here only stops a further shrink.
model_name_or_path: Qwen/Qwen3-VL-2B-Instruct
image_max_pixels: 3000000
quantization_bit: 8
quantization_method: bnb
template: qwen3_vl_nothink
infer_backend: huggingface
do_sample: false
trust_remote_code: true
